<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruofan Wang — Gallery</title>
    <meta name="description" content="Gallery of photography and moments by Ruofan Wang.">
    <link rel="canonical" href="grid-gallery.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="grid.css">
</head>
<body>
    <header>
        <h1>Ruofan Wang</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="flexbox-projects.html">Projects</a></li>
                <li><a href="grid-gallery.html" aria-current="page">Gallery</a></li>
                <li><a href="bootstrap-resume.html">Resume</a></li>
                <li><button type="button" class="button-link theme-toggle" id="theme-toggle" data-theme-toggle aria-label="Toggle theme"><span class="icon" aria-hidden="true"></span></button></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="gallery">
            <h2>Photo Gallery</h2>
            <div class="gallery-grid">
                <div class="gallery-item item-span-2-2"> <!--large image-->
                    <img src="images/photography1.jpg" alt="photography1">
                    <div class="caption">photography in Qingdao</div>
                </div>

                <div class="gallery-item"> <!--standard image-->
                    <img src="images/Flower.jpg" alt="Flower photography">
                    <div class="caption">Flower photography</div>
                </div>

                <div class="gallery-item item-span-1-2"> <!--Tall image-->
                    <img src="images/Coffee.jpg" alt="Coffee">
                    <div class="caption">Coffee</div>
                </div>

                <div class="gallery-item item-span-2-1"> <!--wide image-->
                    <img src="images/Firework in Sydney.jpg" alt="Firework in Sydney">
                    <div class="caption">Firework in Sydney</div>
                </div>

                <div class="gallery-item"> <!--standard image-->
                    <img src="images/photography2.jpg" alt="photography on airplain">
                    <div class="caption">photography on airplain</div>
                </div>

                <div class="gallery-item item-span-1-2"> <!--Tall image-->
                    <img src="images/Teambuilding.jpg" alt="Teambuilding">
                    <div class="caption">Teambuilding</div>
                </div>

                 <div class="gallery-item item-span-1-2"> <!--Tall image-->
                    <img src="images/Hometown.jpg" alt="Hometown">
                    <div class="caption">Hometown</div>
                </div>

                <div class="gallery-item"> <!--standard image-->
                    <img src="images/kickboxing.jpg" alt="kickboxing">
                    <div class="caption">Fitness-kickboxing</div>
                </div>


            </div>
        </section>
    </main>
    <footer>
        <p>Phone: (613) 862-8528 | Email: wang1069@algonquinlive.com</p>
        <p><a href="https://github.com/AmberWang1069?tab=repositories">Github</a></p>
    </footer>
    <script defer src="script.js"></script>

</body>
</html>
